[package]
name = "matcha"
version = "2.0.0"
edition = "2024"

license = "MIT OR Apache-2.0"
description = "Utilities for breaking down token streams in proc macros."

keywords = ["macros"]
categories = ["development-tools::procedural-macro-helpers", "parser-implementations"]

[dependencies]
proc-macro2 = { version = "1.0", optional = true }
quote = { version = "1.0", optional = true }

[features]
default = ["proc-macro2-span-locations", "quote"]

quote = ["dep:quote", "proc-macro2"]
proc-macro2 = ["dep:proc-macro2"]
proc-macro2-span-locations = ["proc-macro2", "proc-macro2/span-locations"]

[lints.rust]
missing_docs = "warn"
